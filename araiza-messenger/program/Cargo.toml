cargo-features = ["edition2024"]

[package]
name = "program"
version = "0.1.0"
edition = "2024"

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
solana-program = "2.3"

[dev-dependencies]
solana-program-test = "2.3"
solana-sdk = "2.3"

[lib]
crate-type = ["cdylib", "lib"]

[target.sbpf-solana-solana]
rustflags = ['--cfg', 'getrandom_backend="rrsr"']