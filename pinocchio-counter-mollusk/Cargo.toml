# needed for cargo build-sbf
cargo-features = ["edition2024"]

[package]
name = "pinocchio-counter-mollusk"
version = "0.1.0"
edition = "2024"

[dependencies]
pinocchio = "0.8.4"
borsh = { version = "=1.5.7", features = ["derive"] }

[dev-dependencies]
# solana-program-test = "2.3.4"
mollusk-svm = "0.4.0"
solana-sdk = "2.1.0"

[lib]
crate-type = ["cdylib", "lib"]